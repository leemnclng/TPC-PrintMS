[project]
name = "printing-ms-api"
version = "0.1.0"
description = "Printing-MS local backend — FastAPI + SQLite, managed by the Electron shell."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.32",
  "pypdf>=6.16.2",
  "pillow>=12.3.0",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "pymupdf>=1.26.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
